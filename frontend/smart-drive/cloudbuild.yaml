# Build da PWA passando as URLs do backend como build-arg (NEXT_PUBLIC_* é
# inlinado em build-time). Uso:
#   gcloud builds submit frontend/smart-drive \
#     --config frontend/smart-drive/cloudbuild.yaml \
#     --substitutions=_API_URL=https://api...,_WS_URL=https://api...,_IMAGE=southamerica-east1-docker.pkg.dev/PROJECT/smartdrive/web:latest
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_WS_URL=${_WS_URL}
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
